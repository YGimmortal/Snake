<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Play — HORIZON SNAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="game-page">
<div id="app" class="game-app">
  <div class="panel game-panel">
    <div class="hud">
      <div class="score-box">SCORE <span id="hud-score">0</span><small>BEST <span id="hud-best">0</span></small></div>
      <div class="bonus-banner" id="bonus-banner"><span class="bonus-dot"></span><span id="bonus-text">Bonus 5.0s</span></div>
      <div class="level-box">LV <span id="hud-level">1</span><small>LEVEL</small></div>
    </div>
    <div class="power-chip" id="power-chip"></div>

    <div id="stage-wrap">
      <canvas id="stage" width="480" height="480"></canvas>
      <div class="fx-layer" id="fx-layer"></div>
      <div class="combo-badge" id="combo-badge">COMBO ×2</div>
      <div class="toast-layer" id="toast-layer"></div>

      <div class="overlay" id="overlay-pause">
        <h3>PAUSED</h3>
        <p>Tap resume · Esc / P · or tap outside</p>
        <button class="btn primary" id="btn-resume">RESUME</button>
        <button class="btn ghost" id="btn-quit-pause">Quit to menu</button>
      </div>

      <div class="overlay" id="overlay-gameover">
        <h3 id="go-title">GAME OVER</h3>
        <p id="go-sub">Score 0 · +0 ¢ earned</p>
        <p class="ach-unlocked" id="go-achievements"></p>
        <button class="btn primary" id="btn-again">PLAY AGAIN</button>
        <button class="btn ghost" id="btn-quit-go">Quit to menu</button>
      </div>
    </div>

    <div class="active-fx" id="active-fx"></div>

    <div class="legend compact">
      <span id="legend-food"><i style="background:var(--gold)"></i>food</span>
      <span><i style="background:var(--red)"></i>ember</span>
      <span><i style="background:var(--sun)"></i>sunstone</span>
      <span><i style="background:var(--blue)"></i>frost</span>
      <span><i style="background:var(--purple)"></i>×2</span>
      <span><i style="background:var(--magenta)"></i>×3</span>
      <span><i style="background:var(--silver)"></i>coins</span>
      <span><i style="background:var(--shield)"></i>shield</span>
      <span><i style="background:var(--gold)"></i>power</span>
      <span><i style="background:var(--diamond)"></i>diamond</span>
    </div>
    <div class="hint">Drag / swipe to steer · Tap to pause · Arrows / WASD · P / Esc · Fullscreen locked</div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/game.js"></script>
</body>
</html>

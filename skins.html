<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Skins — VIPER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <div class="panel">
    <div class="back-row">
      <a href="index.html"><button class="icon-btn">←</button></a>
      <h2>SKINS</h2>
      <div style="width:38px"></div>
    </div>
    <div class="stat coin" style="margin-bottom:14px;"><div class="label">Balance</div><div class="value" id="skins-coins">0 ¢</div></div>
    <div class="skin-grid" id="skin-grid"></div>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
  function buildSkinGrid() {
    const grid = document.getElementById("skin-grid");
    grid.innerHTML = "";
    SKINS.forEach(skin => {
      const owned = save.ownedSkins.includes(skin.id);
      const selected = save.selectedSkin === skin.id;
      const card = document.createElement("div");
      card.className = "skin-card" + (selected ? " selected" : "");
      card.innerHTML = `
        <canvas></canvas>
        <div class="skin-name">${skin.name}</div>
        ${owned ? `<div class="skin-owned">${selected ? "EQUIPPED" : "OWNED · tap to equip"}</div>` : `<div class="skin-price">${skin.price} ¢ · tap to buy</div>`}
        ${!owned ? `<div class="skin-lock">🔒</div>` : ``}
      `;
      card.addEventListener("click", () => {
        ensureAudio(); sfx.select();
        if (owned) {
          save.selectedSkin = skin.id;
          persist(); buildSkinGrid();
        } else if (save.coins >= skin.price) {
          save.coins -= skin.price;
          save.ownedSkins.push(skin.id);
          save.selectedSkin = skin.id;
          persist(); buildSkinGrid();
        } else {
          card.animate([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 250 });
        }
      });
      grid.appendChild(card);
      drawSkinPreview(card.querySelector("canvas"), skin);
    });
    document.getElementById("skins-coins").textContent = fmtCoins(save.coins);
  }
  buildSkinGrid();
</script>
</body>
</html>
